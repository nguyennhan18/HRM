spring:
  servlet:
    multipart:
      max-file-size: ${HRM_DOCUMENT_MAX_SIZE:10MB}
      # Multipart envelope needs headroom above the per-file limit.
      max-request-size: 11MB
  application:
    name: hrm
  jpa:
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

hrm:
  documents:
    directory: ${HRM_DOCUMENT_DIRECTORY:./data/documents}
  employee:
    hmac-key: ${HRM_EMPLOYEE_HMAC_KEY}
  auth:
    secret: ${HRM_JWT_SECRET:}
    access-ttl: 15m
    refresh-ttl: 7d
    reset-ttl: 30m
    lock-threshold: 5
    lock-duration: 15m
    rate-limit: 10
    rate-window: 1m
    cors-origins: []
  admin:
    email: ${HRM_ADMIN_EMAIL:}
    password: ${HRM_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  tomcat:
    # Drain rejected uploads within the request envelope so clients receive ProblemDetail.
    max-swallow-size: 11MB
