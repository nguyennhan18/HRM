spring:
  application:
    name: hrm
  jpa:
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

hrm:
  admin:
    email: ${HRM_ADMIN_EMAIL:}
    password: ${HRM_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
