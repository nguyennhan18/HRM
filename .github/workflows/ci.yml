name: CI

on:
  push:
    branches:
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Maven verify (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw clean verify
